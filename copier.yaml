project_name:
    type: str
    help: Wat is the name of your project?

module_name:
    type: str
    help: Wat is the name of your package?
    # should not contain hyphens, spaces, or other special characters, and should be a valid Python identifier
    validator:
        - "^[a-zA-Z_][a-zA-Z0-9_]*$"

project_intent:
    type: str
    help: Give the high level goal of your project in one or two sentences.

_tasks:
    - command: git init
      working_directory: "{{ project_name }}"
    - command: git add .
      working_directory: "{{ project_name }}"
    - command: uvx prek install
      working_directory: "{{ project_name }}"
    - command: uvx prek autoupdate
      working_directory: "{{ project_name }}"
    - command: uv venv
      working_directory: "{{ project_name }}"
    - command: Remove-Item -Force .gitignore,.pre-commit-config.yaml,pyproject.toml,AGENTS.md
      when: "{{ _copier_conf.os == 'windows' }}"
    - command: rm .gitignore,.pre-commit-config.yaml,pyproject.toml,AGENTS.md
      when: "{{ _copier_conf.os in  ['linux', 'macos'] }}"
