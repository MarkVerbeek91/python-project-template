project_name:
    type: str
    help: Wat is the name of your project?

module_name:
    type: str
    help: Wat is the name of your package?

project_intent:
    type: str
    help: Give the high level goal of your project in one or two sentences.

_tasks:
    - "git init"
    - "uvx pre-commit install"
    - "uvx pre-commit autoupdate"
    - "git add ."

_exclude:
    - ".git"
    - ".gitignore"
    - "copier.yaml"
    - "pyproject.toml"
    - ".pre-commit-config.yaml"
    - "AGENTS.md"
    - "~*"
    - "*.py[co]"
    - "__pycache__"
    - ".DS_Store"
